<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка продукта</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <button class="button-color-change">Смена цветов кнопки</button>

  <div class="products">
    <h1 class="products__title">Выбери свой продукт</h1>

    <button id="change-color-card1-button">Сменить цвет первой карточки</button>
    <button id="change-color-cards-all-button">Сменить цвет всех карточек</button>
    <button id="open-google-button">Открыть страницу Google.com</button>
    <button id="notice-button">Запрос на открытие Google.com</button>
    <button id="output-console-log-button">Вывести сообщение в консоль и уведомление</button>

    <ul class="products__list"></ul>

    <template id="product-template">
      <li class="products__card card">
        <img class="card__img" width="290" height="245">
        <span class="card__desc"></span>
        <h2 class="card__name"></h2>
        <p class="card__purpose"></p>

        <span class="card__compound-title">Состав: </span>
        <ul class="card__compound"></ul>

        <div class="card__price price">
          <b class="price__info">Цена:</b>
          <span class="price__value"></span>
        </div>
      </li>
    </template>
  </div>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script src="homework-9.js" type="module"></script>
  <script src="homework-10.js" type="module"></script>
</body>
</html>
